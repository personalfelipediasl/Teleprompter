<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer subtle glass border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5" />

  <!-- Teleprompter Screen Frame -->
  <g filter="url(#shadow)">
    <!-- Monitor Body -->
    <rect x="96" y="96" width="320" height="240" rx="28" fill="#1e293b" stroke="url(#accent)" stroke-width="6" />
    
    <!-- Camera Eye Indicator (Top Center Lens) -->
    <circle cx="256" cy="122" r="9" fill="#ef4444" />
    <circle cx="256" cy="122" r="14" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 3" />
    
    <!-- Prompter Reading Lines -->
    <rect x="136" y="152" width="180" height="14" rx="7" fill="#64748b" />
    <!-- Active Focus Highlighted Reading Line -->
    <rect x="136" y="180" width="240" height="18" rx="9" fill="#38bdf8" />
    <!-- Reading Indicator Arrow on left -->
    <polygon points="120,189 128,183 128,195" fill="#38bdf8" />
    
    <rect x="136" y="214" width="210" height="14" rx="7" fill="#94a3b8" />
    <rect x="136" y="242" width="150" height="14" rx="7" fill="#64748b" opacity="0.7" />
    <rect x="136" y="270" width="190" height="14" rx="7" fill="#475569" opacity="0.5" />
    
    <!-- Stand / Glass Bevel Base -->
    <path d="M 216 336 L 196 400 L 316 400 L 296 336 Z" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <!-- Base Plate -->
    <rect x="160" y="400" width="192" height="20" rx="10" fill="#334155" />
    <circle cx="256" cy="410" r="4" fill="#06b6d4" />
  </g>
</svg>
